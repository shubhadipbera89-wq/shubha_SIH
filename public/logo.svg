<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Gold Ring Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FDF0A6" />
    </linearGradient>

    <!-- Dark Green Emerald Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#084227" />
      <stop offset="70%" stop-color="#032113" />
      <stop offset="100%" stop-color="#01140B" />
    </radialGradient>

    <!-- Text Gradient for Samadhan -->
    <linearGradient id="textGreenGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Canvas & Gold Ring -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="12" />
  <circle cx="250" cy="250" r="231" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#000000" stroke-width="3" stroke-opacity="0.5" />

  <!-- Background Silhouettes (City Skyline & Parliament Domes + Gear) -->
  <g fill="#06321D" opacity="0.85">
    <!-- Left Govt/Heritage Domes -->
    <path d="M 60 280 L 60 260 L 70 260 L 70 240 L 80 230 C 80 220, 100 220, 100 230 L 110 240 L 110 260 L 120 260 L 120 280 Z" />
    <path d="M 115 280 L 115 230 L 130 215 C 130 200, 160 200, 160 215 L 175 230 L 175 280 Z" />
    <polygon points="135,215 137,200 145,200 143,215" fill="#D4AF37" opacity="0.6" />
    <polygon points="90,230 92,218 97,218 95,230" fill="#D4AF37" opacity="0.6" />
    <path d="M 170 280 L 170 245 L 180 240 L 195 240 L 205 245 L 205 280 Z" />

    <!-- Right Modern Buildings & Gear -->
    <rect x="330" y="170" width="30" height="110" rx="2" />
    <rect x="365" y="145" width="35" height="135" rx="2" />
    <rect x="405" y="190" width="25" height="90" rx="2" />

    <!-- Gear Icon Silhouette -->
    <g transform="translate(415, 205) scale(0.8)" fill="#094A2B">
      <circle cx="0" cy="0" r="16" />
      <circle cx="0" cy="0" r="8" fill="#042817" />
      <path d="M -3 -22 H 3 V -16 H -3 Z M -3 16 H 3 V 22 H -3 Z M -22 -3 V 3 H -16 V -3 Z M 16 -3 V 3 H 22 V -3 Z" />
    </g>

    <!-- Ground Curve -->
    <path d="M 30 285 Q 250 265 470 285 L 470 300 L 30 300 Z" fill="#042314" />
  </g>

  <!-- TOP ELEMENT: Light Bulb with Sprout & Rays -->
  <g transform="translate(250, 115)">
    <!-- Sun Rays -->
    <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-62" />
      <line x1="-32" y1="-32" x2="-40" y2="-40" />
      <line x1="32" y1="-32" x2="40" y2="-40" />
      <line x1="-48" y1="0" x2="-58" y2="0" />
      <line x1="48" y1="0" x2="58" y2="0" />
      <line x1="-38" y1="28" x2="-46" y2="34" />
      <line x1="38" y1="28" x2="46" y2="34" />
    </g>

    <!-- Bulb Outer Outline -->
    <path d="M -32 -5 C -45 -35, 45 -35, 32 -5 C 22 15, 16 22, 16 32 L -16 32 C -16 22, -22 15, -32 -5 Z" 
          fill="#06321D" stroke="#FFFFFF" stroke-width="4" filter="url(#glow)" />
    
    <!-- Bulb Screw Base -->
    <path d="M -14 34 H 14 V 38 H -14 Z M -11 40 H 11 V 44 H -11 Z M -7 46 H 7 V 49 H -7 Z" fill="#E5E7EB" />

    <!-- Sprout Inside Bulb (Green Leaves) -->
    <path d="M 0 25 C -5 10, -22 5, -18 -8 C -5 -12, 0 5, 0 25 Z" fill="#22C55E" />
    <path d="M 0 25 C 5 10, 22 5, 18 -8 C 5 -12, 0 5, 0 25 Z" fill="#4ADE80" />
    <path d="M 0 25 V -4" stroke="#15803D" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- CENTER ELEMENT: 3 Tricolor People / Lotus Sprout Base -->
  <g transform="translate(250, 235)">
    <!-- Base Leaf Wings -->
    <path d="M 0 42 C -45 55, -100 25, -95 -10 C -50 -5, -20 25, 0 42 Z" fill="#15803D" opacity="0.9" />
    <path d="M 0 42 C 45 55, 100 25, 95 -10 C 50 -5, 20 25, 0 42 Z" fill="#22C55E" opacity="0.9" />

    <!-- CENTER PERSON (WHITE) -->
    <g>
      <circle cx="0" cy="-48" r="16" fill="#FFFFFF" />
      <path d="M 0 35 C -18 30, -35 -15, -45 -30 C -40 -35, -25 -25, -15 -10 C -10 10, 0 20, 0 35 Z" fill="#F3F4F6" />
      <path d="M 0 35 C 18 30, 35 -15, 45 -30 C 40 -35, 25 -25, 15 -10 C 10 10, 0 20, 0 35 Z" fill="#FFFFFF" />
      <path d="M -18 10 Q 0 -25 18 10 L 0 35 Z" fill="#FFFFFF" />
    </g>

    <!-- LEFT PERSON (SAFFRON / ORANGE) -->
    <g transform="translate(-52, 10) rotate(-15)">
      <circle cx="0" cy="-36" r="13" fill="#FF9933" />
      <path d="M 0 25 C -12 20, -28 -10, -35 -20 C -30 -25, -18 -18, -10 -5 C -5 5, 0 15, 0 25 Z" fill="#F97316" />
      <path d="M 0 25 C 12 20, 24 -10, 30 -20 C 26 -25, 16 -18, 8 -5 C 4 5, 0 15, 0 25 Z" fill="#FF9933" />
    </g>

    <!-- RIGHT PERSON (GREEN) -->
    <g transform="translate(52, 10) rotate(15)">
      <circle cx="0" cy="-36" r="13" fill="#138808" />
      <path d="M 0 25 C -12 20, -24 -10, -30 -20 C -26 -25, -16 -18, -8 -5 C -4 5, 0 15, 0 25 Z" fill="#15803D" />
      <path d="M 0 25 C 12 20, 28 -10, 35 -20 C 30 -25, 18 -18, 10 -5 C 5 5, 0 15, 0 25 Z" fill="#22C55E" />
    </g>
  </g>

  <!-- TEXT & TAGLINE BRANDING -->
  <g transform="translate(250, 360)">
    <!-- Brand Name "JanSamadhan" -->
    <text text-anchor="middle" y="0" font-family="'Inter', 'Montserrat', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="-1">
      <tspan fill="#FFFFFF">Jan</tspan>
      <tspan fill="url(#textGreenGradient)">Samadhan</tspan>
    </text>

    <!-- Tricolor Indicator Accent Bar -->
    <g transform="translate(0, 16)">
      <line x1="-90" y1="0" x2="-10" y2="0" stroke="#FF9933" stroke-width="4" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
      <line x1="10" y1="0" x2="90" y2="0" stroke="#138808" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Subtitle Tagline "PEOPLE · IDEAS · SOLUTIONS" -->
    <text text-anchor="middle" y="38" font-family="'Inter', 'Montserrat', system-ui, sans-serif" font-weight="700" font-size="13" fill="#E2E8F0" letter-spacing="4">
      PEOPLE  •  IDEAS  •  SOLUTIONS
    </text>
  </g>
</svg>
